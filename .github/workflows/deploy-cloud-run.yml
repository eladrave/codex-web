name: Deploy Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: codex-web-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.repository == 'eladrave/codex-web'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.release.outputs.url }}

    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build the production image with Cloud Build
        env:
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/codex-web:${GITHUB_SHA::12}"
          printf 'IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
          gcloud builds submit \
            --no-source \
            --config=cloudbuild.github.yaml \
            --substitutions="_IMAGE=${image},_SOURCE_REPOSITORY=https://github.com/${GITHUB_REPOSITORY}.git,_SOURCE_REVISION=${GITHUB_SHA}" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --quiet

      - name: Update the existing Cloud Run service image
        env:
          GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          gcloud run services update "$GCP_CLOUD_RUN_SERVICE" \
            --image="$IMAGE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --quiet

      - name: Report the production revision
        id: release
        env:
          GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          revision="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format='value(status.latestReadyRevisionName)')"
          url="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format='value(status.url)')"
          [[ -n "$revision" && -n "$url" ]]
          printf 'revision=%s\nurl=%s\n' "$revision" "$url" >> "$GITHUB_OUTPUT"
          printf 'Deployed %s as %s at %s\n' "$IMAGE" "$revision" "$url"
